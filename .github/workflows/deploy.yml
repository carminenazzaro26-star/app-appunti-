name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Esegui il deploy ad ogni push su main

permissions:
  contents: write  # Necessario per il deploy sul branch gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Genera config.js iniettando i segreti GitHub
      - name: Generate config.js from secrets
        run: |
          sed \
            -e "s|__SUPABASE_URL__|${{ secrets.SUPABASE_URL }}|g" \
            -e "s|__SUPABASE_KEY__|${{ secrets.SUPABASE_KEY }}|g" \
            -e "s|__GOOGLE_CLIENT_ID__|${{ secrets.GOOGLE_CLIENT_ID }}|g" \
            config.template.js > config.js
        # NOTA: config.js NON viene committato nel repo (è in .gitignore).
        # Viene generato solo in questo ambiente di build e poi deployato.

      # Deploy su branch gh-pages (solo i file statici)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: |
            .github
            .gitignore
            api
            .venv
            build
            dist
            __pycache__
            .idea
            requirements.txt
            Procfile
            vercel.json
            schema.sql
            scratch_test.py
            AppAppunti.spec
            config.template.js
            task.md
